<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)" />
    <title>Monitoring Gudang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="site-header">
      <img class="brand" src="assets/taggiot-logo.svg" alt="TaggIoT" />
      <div class="site-header__right">
        <h1 class="site-title">Monitoring Gudang</h1>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Mode gelap" aria-pressed="false">
          <img id="theme-icon" src="assets/Icon-Moon.svg" alt="" width="20" height="20" />
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      <section class="summary" aria-label="Ringkasan status sensor">
        <!-- Summary Normal -->
        <article class="summary__box summary__box--normal">
          <p class="summary__label">Normal</p>
          <p class="summary__count" id="count-normal">0</p>
          <img class="summary__icon" src="assets/temp_preferences_eco.svg" alt="" />
        </article>

        <!-- Summary Peringatan -->
        <article class="summary__box summary__box--peringatan">
          <p class="summary__label">Peringatan</p>
          <p class="summary__count" id="count-peringatan">0</p>
          <img class="summary__icon" src="assets/thermometer_alert.svg" alt="" />
        </article>

        <!-- Summary Offline -->
        <article class="summary__box summary__box--offline">
          <p class="summary__label">Offline</p>
          <p class="summary__count" id="count-offline">0</p>
          <img class="summary__icon" src="assets/signal_disconnected.svg" alt="" />
        </article>
      </section>

      <!-- Toolbar: pencarian dan filter -->
      <div class="toolbar">
        <!-- Search -->
        <div class="search">
          <img src="assets/search.svg" alt="" width="20" height="20" />
          <label for="search-input" class="sr-only">Cari sensor berdasarkan ID atau lokasi</label>
          <input type="search" id="search-input" class="search__input" placeholder="Cari ID atau lokasi..." autocomplete="off" />
        </div>

        <!-- 4 tombol filter -->
        <div class="filter" id="filter-group" role="group" aria-label="Filter status sensor">
          <button type="button" class="filter__btn is-active" data-filter="semua" aria-pressed="true">Semua</button>
          <button type="button" class="filter__btn" data-filter="normal" aria-pressed="false">Normal</button>
          <button type="button" class="filter__btn" data-filter="peringatan" aria-pressed="false">Peringatan</button>
          <button type="button" class="filter__btn" data-filter="offline" aria-pressed="false">Offline</button>
        </div>
      </div>

      <!-- Indikator Auto Refresh -->
      <div class="refresh-info">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"></path>
          <path d="M3 12a9 9 0 1 0 2.81-6.73L3 8"></path>
          <path d="M3 22v-6h6"></path>
          <path d="M21 12a9 9 0 1 0-2.81 6.73L21 16"></path>
        </svg>
        <p id="update-info" style="margin: 0">Dimuat --:--:-- &middot; refresh otomatis tiap 30 detik</p>
      </div>

      <!-- Sensor Grid-->
      <section class="sensors" aria-label="Daftar sensor">
        <h2 class="sr-only">Daftar sensor</h2>

        <!-- Sensor Grid A1 Error-->
        <div class="message" id="message-error" role="alert" hidden>
          <img src="assets/Icon-Error.svg" alt="" width="32" height="32" />
          <div class="message__text">
            <h3 class="message__title">Data sensor tidak dapat dimuat</h3>
            <p class="message__desc">Periksa koneksi, lalu coba lagi.</p>
          </div>
          <button type="button" class="btn" id="retry-btn">Coba Lagi</button>
        </div>

        <!-- Sensor Grid A2 Kosong-->
        <div class="message" id="message-empty" role="status" hidden>
          <img src="assets/empty_box.svg" alt="" width="32" height="32" />
          <div class="message__text">
            <h3 class="message__title">Tidak ada sensor dengan status ini</h3>
            <p class="message__desc">Coba pilih filter lain.</p>
          </div>
        </div>
        <div class="sensor-grid" id="sensor-grid"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>©2026 PT. Teknologi Tata Data (TaggIoT)</p>
    </footer>

    <!-- Isian Sensor Grid -->
    <template id="sensor-card-template">
      <article class="card">
        <div class="card__top">
          <h3 class="card__id"></h3>
          <span class="badge"></span>
        </div>
        <p class="card__lokasi"></p>
        <hr class="card__divider" />
        <div class="card__values">
          <div class="value">
            <p class="value__label"><span class="icon icon--suhu" aria-hidden="true"></span> Suhu</p>
            <p class="value__number card__suhu"></p>
          </div>
          <div class="value">
            <p class="value__label"><span class="icon icon--kelembapan" aria-hidden="true"></span> Kelembapan</p>
            <p class="value__number card__kelembapan"></p>
          </div>
        </div>
        <hr class="card__divider" />
        <p class="card__waktu"></p>
      </article>
    </template>
    <!---------------------------------->
    <script src="script.js"></script>
  </body>
</html>
